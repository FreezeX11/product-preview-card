<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Product Preview Card</title>
  </head>
  <body>
    <main>
      <div class="product">
        <div class="product__img">
          <img src="assets/image-product-mobile.jpg" />
        </div>

        <div class="product__content">
          <p>Perfume</p>

          <h1 class="product__title">Gabrielle Essence Eau De Parfum</h1>

          <p> 
            A floral, sobar and voluptous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL
          </p>

          <div class="flex-group">
            <p class="product__price">$149.99</p>
            <p class="product__original-price">$149.99</p>
          </div>

          <button class="button">Add to Cart</button>
        </div>
      </div>
    </main> 
  </body>
</html>
